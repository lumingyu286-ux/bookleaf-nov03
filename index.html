<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书页之间｜阅读与知识导航</title><meta name="description" content="找书、读书、查资料，把想知道的事情慢慢展开。分类查找、收藏常用网址。"><style>:root{--ink:#243044;--bg:#fbfaf6;--card:#fff;--hero:#e5e9eb;--accent:#a84938;--gold:#eacb84;--muted:#5b6877;--border:#d9dee2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}a{color:inherit}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{max-width:1240px;margin:auto;padding:24px}.brand{font-size:20px;font-weight:700}.tag{font-size:14px;color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero{position:relative;overflow:hidden;margin:24px 0;padding:48px;border-radius:20px;background:var(--hero);min-height:210px}.hero h1{max-width:680px;font-size:clamp(36px,5vw,60px);line-height:1.12;letter-spacing:-.04em;margin:0 0 16px;position:relative;z-index:1}.hero p{margin:0;max-width:560px;font-size:18px;position:relative;z-index:1}.illustration{position:absolute;right:5%;bottom:-30px;width:250px;height:210px;opacity:.9}.books .illustration{background:repeating-linear-gradient(90deg,var(--accent) 0 20px,var(--gold) 20px 35px,var(--ink) 35px 50px,transparent 50px 58px);transform:rotate(-8deg);border-radius:8px}.nature .illustration{background:var(--gold);clip-path:polygon(0 100%,34% 22%,48% 52%,66% 4%,100% 100%)}.adult{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--ink);color:white;padding:20px 24px;border-radius:12px}.adult strong,.adult span{display:block}.adult span{font-size:14px;color:#dde7e0}.adult a{white-space:nowrap;padding:10px 16px;text-decoration:none;font-weight:700;background:var(--gold);color:var(--ink);border-radius:8px}.controls{display:flex;align-items:end;gap:12px;margin:24px 0}.search{flex:1}.search label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}.filter{padding:12px 16px;background:white;color:var(--ink);border:1px solid var(--border);border-radius:8px;font-weight:700;cursor:pointer}.filter[aria-pressed=true]{background:var(--ink);color:white}.layout{display:grid;grid-template-columns:210px 1fr;gap:32px}.side{align-self:start;position:sticky;top:24px}.side h2{font-size:14px;margin:0 0 12px}.side nav{display:flex;flex-direction:column;gap:8px}.side a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700}.side a:hover{background:var(--hero)}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.group{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;scroll-margin-top:24px}.group h2{margin:0;font-size:24px}.group p{margin:4px 0 16px;font-size:14px;color:var(--muted)}.entry{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:12px 0}.entry a{flex:1;text-decoration:none;min-width:0}.entry a:hover strong{text-decoration:underline}.entry strong,.entry small{display:block}.entry small{color:var(--muted);font-size:14px}.star{width:40px;height:40px;border:0;border-radius:50%;font-size:20px;background:var(--bg);color:var(--muted);cursor:pointer}.star[aria-pressed=true]{background:var(--gold);color:var(--ink)}.empty{display:none;background:white;padding:32px;text-align:center;border-radius:12px}.footer{color:var(--muted);font-size:14px;margin:40px 0 16px}.nature .layout{display:block}.nature .side{position:static;margin:0 0 24px}.nature .side nav{flex-direction:row;flex-wrap:wrap}.nature .side a{background:white;border:1px solid var(--border)}.nature .groups{grid-template-columns:repeat(3,minmax(0,1fr))}.nature .group:nth-child(3n+1){border-top:6px solid #b9d4a2}.nature .group:nth-child(3n+2){border-top:6px solid #dd9250}.nature .group:nth-child(3n){border-top:6px solid #8bb3a1}@media(max-width:900px){.nature .groups{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:32px}.illustration{opacity:.25}}@media(max-width:640px){.wrap{padding:16px}.tag{display:none}.hero{padding:32px 24px;min-height:0}.hero h1{font-size:30px}.hero p{font-size:16px}.illustration{width:130px;height:130px}.adult{align-items:flex-start;flex-direction:column}.controls{align-items:stretch;flex-direction:column}.layout{display:block}.side{position:static;margin-bottom:24px}.side nav{flex-direction:row;overflow:auto}.side a{white-space:nowrap}.groups,.nature .groups{grid-template-columns:1fr}.nature .side nav{flex-wrap:nowrap}.group{padding:20px}}</style></head><body class="books"><div class="wrap"><header><div class="brand">▤ 书页之间</div><span class="tag">阅读与知识导航</span></header><main><section class="hero"><h1>从这里，遇见下一本书。</h1><p>找书、读书、查资料，把想知道的事情慢慢展开。</p><div class="illustration" aria-hidden="true"></div></section><section class="adult" aria-label="成人内容入口"><div><strong>成人内容百科</strong><span>成人内容入口，仅限年满 18 周岁者访问</span></div><a href="https://chengrenbaike.com/" target="_blank" rel="noopener noreferrer">访问成人百科 ↗</a></section><div class="controls"><div class="search"><label for="query">查找网址</label><input id="query" type="search" placeholder="输入网站或分类关键词"></div><button class="filter" id="filter" aria-pressed="false">只看收藏 ☆</button></div><div class="layout"><aside class="side"><h2>浏览分类</h2><nav id="nav" aria-label="分类导航"></nav></aside><div><div class="groups" id="groups"></div><div class="empty" id="empty" role="status"></div></div></div></main><footer class="footer">书页之间 · 收藏保存在当前浏览器中，外部网站内容以各站为准。</footer></div><script>const groups=[["找书与书评","从一本书出发",["豆瓣读书","https://book.douban.com/","书目与读者评论"],["Google Books","https://books.google.com/","搜索图书与预览"],["Goodreads","https://www.goodreads.com/","书单与读者交流"],["Open Library","https://openlibrary.org/","开放的图书目录"]],["数字图书馆","在线发现图书",["国家哲学社会科学文献中心","https://www.ncpssd.cn/","人文社科文献资源"],["Project Gutenberg","https://www.gutenberg.org/","公共领域电子书"],["Internet Archive","https://archive.org/","数字资料与图书收藏"],["HathiTrust","https://www.hathitrust.org/","数字图书馆馆藏"]],["阅读与写作","把灵感留在纸上",["少数派","https://sspai.com/","数字生活与阅读文章"],["Wikisource","https://zh.wikisource.org/","自由的原始文献"],["Poetry Foundation","https://www.poetryfoundation.org/","诗歌与文学文章"]],["知识检索","把问题查清楚",["维基百科","https://zh.wikipedia.org/","开放百科与参考资料"],["Stanford Encyclopedia of Philosophy","https://plato.stanford.edu/","哲学主题百科"],["Google Scholar","https://scholar.google.com/","查找学术文献"],["JSTOR","https://www.jstor.org/","学术期刊与书籍"]],["公共图书馆","寻找馆藏与服务",["中国国家图书馆","https://www.nlc.cn/","馆藏目录与读者服务"],["上海图书馆","https://www.library.sh.cn/","馆藏及阅读活动"],["New York Public Library","https://www.nypl.org/","图书馆资源与活动"]],["听书与播客","换一种方式读书",["喜马拉雅","https://www.ximalaya.com/","有声内容与播客"],["蜻蜓 FM","https://www.qingting.fm/","有声节目"],["LibriVox","https://librivox.org/","公共领域有声书"]]];const id="bookleaf-nov03",box=document.querySelector('#groups'),nav=document.querySelector('#nav'),search=document.querySelector('#query'),filter=document.querySelector('#filter'),empty=document.querySelector('#empty');let saved=[];try{saved=JSON.parse(localStorage.getItem(id)||'[]')}catch{}if(!Array.isArray(saved))saved=[];let only=false;groups.forEach((g,i)=>{const a=document.createElement('a');a.href='#group-'+i;a.textContent=g[0];nav.append(a)});function render(){box.replaceChildren();let n=0;const q=search.value.trim().toLowerCase();groups.forEach((g,i)=>{const found=g.slice(2).filter(x=>(!q||[g[0],...x].join(' ').toLowerCase().includes(q))&&(!only||saved.includes(x[1])));if(!found.length)return;n+=found.length;const sec=document.createElement('section');sec.id='group-'+i;sec.className='group';const h=document.createElement('h2');h.textContent=g[0];const p=document.createElement('p');p.textContent=g[1];sec.append(h,p);found.forEach(([name,url,desc])=>{const row=document.createElement('div');row.className='entry';const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';const t=document.createElement('strong');t.textContent=name+' ↗';const d=document.createElement('small');d.textContent=desc;a.append(t,d);const b=document.createElement('button');b.className='star';b.setAttribute('aria-label','收藏 '+name);b.setAttribute('aria-pressed',String(saved.includes(url)));b.textContent=saved.includes(url)?'★':'☆';b.onclick=()=>{saved=saved.includes(url)?saved.filter(x=>x!==url):[...saved,url];try{localStorage.setItem(id,JSON.stringify(saved))}catch{}render()};row.append(a,b);sec.append(row)});box.append(sec)});empty.style.display=n?'none':'block';empty.textContent=only&&!q?'还没有收藏网址，点击星标即可收藏。':'没有找到匹配的网址，试试其他关键词。'}search.addEventListener('input',render);filter.onclick=()=>{only=!only;filter.setAttribute('aria-pressed',String(only));filter.textContent=only?'显示全部':'只看收藏 ☆';render()};render();</script></body></html>
